name: Java AI Documentation Agent

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  generate-java-docs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Java Changes
        run: |
          git diff \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.merge_commit_sha }} \
            -- '*.java' 'pom.xml' '*.gradle' \
            ':!target/*' ':!.gradle/*' \
            > java_changes.diff

          if [ ! -s java_changes.diff ]; then
            echo "No Java changes detected."
            exit 0
          fi

      - name: Generate AI Changelog
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DIFF_CONTENT=$(head -c 25000 java_changes.diff)

          jq -n \
            --arg diff "$DIFF_CONTENT" \
            '{
              model: "llama-3.3-70b-versatile",
              messages: [
                {
                  role: "system",
                  content: "You are an expert Java Architect."
                },
                {
                  role: "user",
                  content:
                    "Review this git diff and produce a concise markdown changelog.\n\nRules:\n- Mention new classes.\n- Mention new methods.\n- Mention dependency updates.\n- Ignore formatting-only changes.\n- Output only markdown bullet points.\n\nGit Diff:\n\($diff)"
                }
              ],
              temperature: 0.2
            }' > request.json

          curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            | jq -r '.choices[0].message.content' > ai_output.txt

          cat ai_output.txt

      - name: Update CHANGELOG
        run: |
          touch CHANGELOG.md

          {
            echo "## PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
            echo
            cat ai_output.txt
            echo
            cat CHANGELOG.md
          } > new_changelog.md

          mv new_changelog.md CHANGELOG.md

      - name: Commit and Push
        run: |
          git config user.name "Java-AI-Agent"
          git config user.email "ai-agent@github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "docs: auto-update changelog for PR #${{ github.event.pull_request.number }}"
          git push