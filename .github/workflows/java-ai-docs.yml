name: Java AI Documentation Agent

on:
  push:
    branches:
      - main

jobs:
  generate-java-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Java Changes
        id: diff
        run: |
          git diff HEAD~1 HEAD \
            -- '*.java' 'pom.xml' '*.gradle' \
            ':!target/*' ':!.gradle/*' \
            > java_changes.diff

          echo "===== Diff Preview ====="
          head -40 java_changes.diff

          if [ ! -s java_changes.diff ]; then
            echo "No Java changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Java changes detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate AI Changelog
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DIFF_CONTENT=$(head -c 25000 java_changes.diff)

          jq -n \
            --arg diff "$DIFF_CONTENT" \
            '{
              model: "llama-3.3-70b-versatile",
              temperature: 0.2,
              messages: [
                {
                  role: "system",
                  content: "You are an expert Java Architect."
                },
                {
                  role: "user",
                  content:
                    "Review the following Java git diff and generate a concise CHANGELOG.\n\nRules:\n- Mention newly added classes.\n- Mention newly added methods.\n- Mention dependency updates.\n- Ignore formatting-only changes.\n- Output ONLY markdown bullet points.\n\nGit Diff:\n\($diff)"
                }
              ]
            }' > request.json

          curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            | jq -r '.choices[0].message.content' > ai_output.txt

          echo "===== AI Output ====="
          cat ai_output.txt

      - name: Update CHANGELOG
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          touch CHANGELOG.md

          {
            echo "# CHANGELOG"
            echo
            echo "## $(date +'%Y-%m-%d')"
            echo
            cat ai_output.txt
            echo
            cat CHANGELOG.md
          } > new_changelog.md

          mv new_changelog.md CHANGELOG.md

      - name: Commit CHANGELOG
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changelog updates."
            exit 0
          fi

          git commit -m "docs: auto-update CHANGELOG"
          git push