name: Java AI Documentation Agent

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-java-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Java Changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git diff "$BASE_SHA" "$HEAD_SHA" \
              -- '*.java' 'pom.xml' '*.gradle' \
              ':!target/*' ':!.gradle/*' \
              > java_changes.diff || true
          elif [[ -n "${{ github.event.before }}" ]] && [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff "${{ github.event.before }}" "${{ github.sha }}" \
              -- '*.java' 'pom.xml' '*.gradle' \
              ':!target/*' ':!.gradle/*' \
              > java_changes.diff || true
          else
            git diff HEAD~1 HEAD \
              -- '*.java' 'pom.xml' '*.gradle' \
              ':!target/*' ':!.gradle/*' \
              > java_changes.diff || true
          fi

          git diff --stat -- '*.java' 'pom.xml' '*.gradle' ':!target/*' ':!.gradle/*' > change_stats.txt || true
          git diff --name-only -- '*.java' 'pom.xml' '*.gradle' ':!target/*' ':!.gradle/*' > changed_files.txt || true

          echo "===== Git Diff Preview ====="
          head -80 java_changes.diff || true

          if [[ ! -s java_changes.diff ]]; then
            echo "No Java changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Java changes detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          echo "commit_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate AI Changelog
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          diff_path = Path("java_changes.diff")
          diff_text = diff_path.read_text(encoding="utf-8", errors="ignore")
          diff_text = diff_text[:60000]

          def sanitize(text: str) -> str:
              return re.sub(r"\s+", " ", text).strip()

          def extract_method_signature(line: str):
              cleaned = line.strip()
              if not cleaned or cleaned.startswith("//") or cleaned.startswith("/*") or cleaned.startswith("*"):
                  return None
              match = re.search(r"\b(?:public|protected|private|static|final|synchronized|default|abstract)\b.*?\b([A-Za-z_][A-Za-z0-9_]*)\s*\(", cleaned)
              if match:
                  return match.group(1)
              return None

          def summarize_change(additions, removals):
              combined = " ".join(additions + removals).lower()
              keyword_map = {
                  "validate": "validation",
                  "email": "email handling",
                  "active": "status handling",
                  "filter": "filtering",
                  "sort": "sorting",
                  "page": "pagination",
                  "search": "search behavior",
                  "stats": "statistics",
                  "toggle": "state toggling",
                  "bulk": "bulk operations",
                  "log": "audit logging",
                  "count": "counting",
                  "save": "persistence",
                  "find": "lookup",
                  "create": "creation",
                  "update": "updates",
                  "deactivate": "deactivation",
                  "reactivate": "reactivation",
                  "throw": "error handling",
                  "normalize": "normalization",
                  "conflict": "conflict checks",
                  "limit": "limiting results",
              }
              matched = []
              for keyword, phrase in keyword_map.items():
                  if keyword in combined:
                      matched.append(phrase)
              if matched:
                  return ", ".join(matched[:4])
              return "behavior and control flow"

          def build_fine_grained_summary(diff_text: str) -> str:
              per_file = {}
              current_file = None
              current_hunk = None
              current_method = None
              hunk_lines = []

              def flush_hunk():
                  nonlocal current_file, current_method, hunk_lines
                  if not current_file or not hunk_lines:
                      return
                  added = [line[1:].strip() for line in hunk_lines if line.startswith("+") and not line.startswith("+++")]
                  removed = [line[1:].strip() for line in hunk_lines if line.startswith("-") and not line.startswith("---")]
                  if not added and not removed:
                      hunk_lines = []
                      return

                  method_name = current_method or None
                  if not method_name:
                      for item in added + removed:
                          method_name = extract_method_signature(item)
                          if method_name:
                              break
                  if not method_name:
                      method_name = "file-level logic"

                  if added and removed:
                      action = f"Updated method {method_name} in {current_file}: replaced logic around {summarize_change(added, removed)}."
                  elif added:
                      action = f"Added method {method_name} in {current_file}: introduces {summarize_change(added, removed)}."
                  else:
                      action = f"Removed method {method_name} from {current_file}: retired {summarize_change(added, removed)}."

                  per_file.setdefault(current_file, []).append(action)
                  hunk_lines = []

              for line in diff_text.splitlines():
                  if line.startswith("diff --git "):
                      flush_hunk()
                      current_file = None
                      current_method = None
                      hunk_lines = []
                      match = re.match(r"diff --git a/(.+) b/(.+)", line)
                      if match:
                          current_file = match.group(2)
                  elif line.startswith("@@"):
                      flush_hunk()
                      current_hunk = line
                      current_method = None
                      hunk_lines = []
                  elif current_file and line.startswith(("+", "-", " ")) and not line.startswith(("+++", "---")):
                      content = line[1:].strip()
                      if content:
                          method_in_line = extract_method_signature(content)
                          if method_in_line:
                              current_method = method_in_line
                      hunk_lines.append(line)

              flush_hunk()

              if not per_file:
                  return "- No file-level method changes detected in this diff."

              lines = []
              for file_path in sorted(per_file):
                  lines.append(f"- File: {file_path}")
                  for entry in per_file[file_path]:
                      lines.append(f"  - {entry}")
              return "\n".join(lines)

          def build_fallback_markdown() -> str:
              added = []
              changed = []
              removed = []
              fixed = []

              detailed_summary = build_fine_grained_summary(diff_text)
              if detailed_summary:
                  summary_lines = ["- Detailed diff summary:"] + ["  " + line if line.startswith("- ") else "  " + line for line in detailed_summary.splitlines()]
                  changed.extend(summary_lines)

              if re.search(r"\b(exception|error|invalid|null|guard|validate|throw)\b", diff_text, flags=re.IGNORECASE):
                  fixed.append("- Strengthened validation and error handling around edge cases and invalid input.")
              if re.search(r"\b(concurrent|thread|lock|stream|comparator|cache|async)\b", diff_text, flags=re.IGNORECASE):
                  changed.append("- Improved concurrency, collection handling, or execution flow for better reliability.")
              if re.search(r"^\+.*\b(class|interface|enum|record)\b", diff_text, flags=re.MULTILINE):
                  added.append("- Added new Java types or API surface to support the requested behavior change.")
              if not added and not changed and not removed and not fixed:
                  changed.append("- Updated Java implementation to support the latest behavior and maintenance changes.")

              sections = []
              for heading, items in (("Added", added), ("Changed", changed), ("Removed", removed), ("Fixed", fixed)):
                  if items:
                      section_lines = [f"## {heading}"] + items
                      sections.append("\n".join(section_lines))

              if not sections:
                  sections = ["## Changed\n- Updated Java implementation to support the latest behavior and maintenance changes."]

              return "\n\n".join(sections)

          fallback = build_fallback_markdown()
          Path("ai_output.txt").write_text(fallback, encoding="utf-8")

          api_key = os.environ.get("GROQ_API_KEY", "").strip()
          if api_key:
              diff_preview = diff_text[:30000]
              prompt = f"""You are a Senior Java Software Architect reviewing enterprise changes.

              Review the following git diff and generate a concise but professional Markdown changelog.
              Focus heavily on method-level and file-level detail. For every added, changed, or removed method, name the method, name the file it appears in, and describe what behavior changed.
              Prefer bullets such as:
              - Added method createUser(String, String, boolean) in src/main/java/com/demo/UserController.java: now validates input, normalizes email, and creates a fully initialized user.
              - Changed method getUsers() in src/main/java/com/demo/UserController.java: now filters inactive accounts and sorts results by name.
              - Removed method deactivateUsers(List<Integer>) from src/main/java/com/demo/UserController.java: retired a bulk deactivation flow that is no longer part of the API.
              If a method already exists and the logic changed, describe what replacement or refinement occurred in the implementation.
              Only include sections that have content. Prefer actionable summaries over file-by-file lists.

              Output ONLY Markdown content with headings and bullet points.

              Git diff:

              {diff_preview}
              """

              payload = {
                  "model": "llama-3.3-70b-versatile",
                  "temperature": 0.1,
                  "messages": [
                      {"role": "system", "content": "You are a Senior Java Software Architect."},
                      {"role": "user", "content": prompt},
                  ],
              }

              request = urllib.request.Request(
                  "https://api.groq.com/openai/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))
                      content = data.get("choices", [{}])[0].get("message", {}).get("content", "")
                      if content and content.strip():
                          cleaned = sanitize(content)
                          if cleaned.startswith("##") or cleaned.startswith("-"):
                              Path("ai_output.txt").write_text(cleaned, encoding="utf-8")
                              Path("ai_source.txt").write_text("groq", encoding="utf-8")
              except Exception as exc:
                  Path("ai_source.txt").write_text(f"fallback:{exc}", encoding="utf-8")
          else:
              Path("ai_source.txt").write_text("fallback:no-api-key", encoding="utf-8")

          print("===== Generated Changelog =====")
          print(Path("ai_output.txt").read_text(encoding="utf-8"))
          PY

      - name: Update CHANGELOG
        if: steps.diff.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          touch CHANGELOG.md

          {
            echo "# CHANGELOG"
            echo
            echo "## $(date +'%Y-%m-%d')"
            echo
            echo "**Commit:** $(git rev-parse --short HEAD)"
            echo
            echo "**Files changed:**"
            if [[ -f changed_files.txt ]]; then
              sed 's#^#- #' changed_files.txt || true
            fi
            echo
            cat ai_output.txt
            echo
            cat CHANGELOG.md
          } > new_changelog.md

          mv new_changelog.md CHANGELOG.md

      - name: Upload Changelog Preview
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog-preview
          path: |
            CHANGELOG.md
            ai_output.txt

      - name: Commit CHANGELOG
        if: steps.diff.outputs.has_changes == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No CHANGELOG updates."
            exit 0
          fi

          git commit -m "docs(changelog): auto-update CHANGELOG"
          git push
