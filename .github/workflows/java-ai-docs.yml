name: Java AI Documentation Agent

on:
  push:
    branches:
      - main

jobs:
  generate-java-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Java Changes
        id: diff
        run: |
          git diff HEAD~1 HEAD \
            -- '*.java' 'pom.xml' '*.gradle' \
            ':!target/*' ':!.gradle/*' \
            > java_changes.diff

          echo "===== Git Diff Preview ====="
          head -50 java_changes.diff

          if [ ! -s java_changes.diff ]; then
            echo "No Java changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Java changes detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate AI Changelog
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DIFF_CONTENT=$(head -c 30000 java_changes.diff)

          PROMPT=$(cat <<EOF
          You are a Senior Java Software Architect reviewing enterprise pull requests.

          Review the following Git diff and generate a professional CHANGELOG in Markdown.

          Analyze the intent of the changes instead of simply listing modified files.

          Only include sections that have content.

          ## Added
          - New classes
          - New interfaces
          - New methods
          - New APIs/endpoints
          - New annotations
          - New dependencies
          - New configuration

          ## Changed
          - Business logic
          - Algorithms
          - Validation rules
          - API behavior
          - Database logic
          - Performance improvements
          - Refactoring
          - Architectural improvements
          - Concurrency/thread safety

          ## Removed
          - Deleted methods
          - Deleted classes
          - Removed APIs
          - Removed dependencies
          - Deprecated functionality

          ## Fixed
          - Bug fixes
          - Exception handling
          - Null safety
          - Security improvements
          - Edge cases

          Ignore:
          - Imports
          - Package declarations
          - Formatting
          - Whitespace
          - Comments
          - Variable renames unless behavior changes

          Output ONLY Markdown bullet points.

          Git Diff:

          $DIFF_CONTENT
          EOF
          )

          jq -n \
            --arg prompt "$PROMPT" \
            '{
              model: "llama-3.3-70b-versatile",
              temperature: 0.1,
              messages: [
                {
                  role: "system",
                  content: "You are a Senior Java Software Architect."
                },
                {
                  role: "user",
                  content: $prompt
                }
              ]
            }' > request.json

          echo "===== Request ====="
          cat request.json

          curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            | tee response.json

          jq -r '.choices[0].message.content' response.json > ai_output.txt

          echo "===== AI Output ====="
          cat ai_output.txt

      - name: Update CHANGELOG
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          touch CHANGELOG.md

          {
            echo "# CHANGELOG"
            echo
            echo "## $(date +'%Y-%m-%d')"
            echo
            echo "**Commit:** $(git rev-parse --short HEAD)"
            echo
            cat ai_output.txt
            echo
            cat CHANGELOG.md
          } > new_changelog.md

          mv new_changelog.md CHANGELOG.md

      - name: Commit CHANGELOG
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No CHANGELOG updates."
            exit 0
          fi

          git commit -m "docs(changelog): auto-update CHANGELOG"
          git push
