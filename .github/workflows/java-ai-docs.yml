name: Java AI Documentation Agent

on:
  push:
    branches:
      - main

jobs:
  generate-java-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract Java Changes
        id: diff
        run: |
          git diff HEAD~1 HEAD \
            -- '*.java' 'pom.xml' '*.gradle' \
            ':!target/*' ':!.gradle/*' \
            > java_changes.diff

          echo "===== Git Diff Preview ====="
          head -50 java_changes.diff

          if [ ! -s java_changes.diff ]; then
            echo "No Java changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Java changes detected."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate AI Changelog
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DIFF_CONTENT=$(head -c 30000 java_changes.diff)

          jq -n \
            --arg diff "$DIFF_CONTENT" \
            '{
              model: "llama-3.3-70b-versatile",
              temperature: 0.1,
              messages: [
                {
                  role: "system",
                  content: "You are a Senior Java Software Architect reviewing enterprise pull requests."
                },
                {
                  role: "user",
                  content:
                    "Review the following Git diff and generate a professional CHANGELOG in Markdown.\n\n\
                     Analyze what actually changed instead of simply listing modified files.\n\n\
                     Organize the output into these sections only when applicable:\n\n\
                     ## Added\n\
                     - New classes\n\
                     - New interfaces\n\
                     - New APIs/endpoints\n\
                     - New methods\n\
                     - New annotations\n\
                     - New dependencies\n\
                     - New configuration\n\n\
                     ## Changed\n\
                     - Business logic\n\
                     - Algorithms\n\
                     - Validation rules\n\
                     - API behavior\n\
                     - Database logic\n\
                     - Concurrency/thread safety\n\
                     - Performance optimizations\n\
                     - Refactoring\n\
                     - Architectural improvements\n\n\
                     ## Removed\n\
                     - Deleted methods\n\
                     - Deleted classes\n\
                     - Removed APIs\n\
                     - Removed dependencies\n\
                     - Deprecated functionality\n\n\
                     ## Fixed\n\
                     - Bug fixes\n\
                     - Exception handling\n\
                     - Null safety\n\
                     - Edge cases\n\
                     - Security improvements\n\n\
                     Ignore:\n\
                     - Imports\n\
                     - Package declarations\n\
                     - Formatting\n\
                     - Whitespace\n\
                     - Comments\n\
                     - Variable renaming unless behavior changes\n\n\
                     Write concise, meaningful bullet points that explain the intent of the code changes.\n\
                     Output only Markdown.\n\n\
                     Git Diff:\n\n\($diff)"
                }
              ]
            }' > request.json

          curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            | jq -r '.choices[0].message.content' > ai_output.txt

          echo "===== AI Generated Changelog ====="
          cat ai_output.txt

      - name: Update CHANGELOG
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          touch CHANGELOG.md

          {
            echo "# CHANGELOG"
            echo
            echo "## $(date +'%Y-%m-%d')"
            echo
            echo "**Commit:** $(git rev-parse --short HEAD)"
            echo
            cat ai_output.txt
            echo
            cat CHANGELOG.md
          } > new_changelog.md

          mv new_changelog.md CHANGELOG.md

      - name: Commit CHANGELOG
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No CHANGELOG updates."
            exit 0
          fi

          git commit -m "docs(changelog): auto-update CHANGELOG"
          git push