name: Java AI Documentation Agent

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  generate-java-docs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CLI
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade llm llm-groq

      - name: Show available models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          llm plugins
          llm models

      - name: Run Java AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          DIFF_CONTENT=$(head -c 25000 java_changes.diff)

          llm -m groq/llama-3.1-8b-instant "
          You are an expert Java Architect.
          Review the following git diff of a Java project.
          Write a concise markdown changelog.

          $DIFF_CONTENT
          " > ai_output.txt

          - name: Update CHANGELOG
            run: |
              touch CHANGELOG.md
              echo -e "## PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}\n" > new_changelog.md
              cat ai_output.txt >> new_changelog.md
              echo -e "\n\n$(cat CHANGELOG.md)" >> new_changelog.md
              mv new_changelog.md CHANGELOG.md

          - name: Commit and Push Docs
            run: |
              git config --global user.name "Java-AI-Agent"
              git config --global user.email "ai-agent@github.com"
              git add CHANGELOG.md
              git commit -m "docs: Java AI auto-generated changelog for PR #${{ github.event.pull_request.number }}"
              git push origin main
